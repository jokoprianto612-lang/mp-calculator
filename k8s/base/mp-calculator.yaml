apiVersion: v1
kind: Namespace
metadata:
  name: mp-calculator
  labels:
    name: mp-calculator
    environment: dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mp-calculator-config
  namespace: mp-calculator
data:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"
  CORS_ORIGIN: "https://dev.mpcalculator.app"
  FRONTEND_URL: "https://dev.mpcalculator.app"
---
apiVersion: v1
kind: Secret
metadata:
  name: mp-calculator-secrets
  namespace: mp-calculator
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@postgres:5432/mp_calculator"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "your-super-secret-jwt-key-min-32-chars"
  COOKIE_SECRET: "your-super-secret-cookie-key-min-32-chars"
  DEEPL_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-calculator-api
  namespace: mp-calculator
  labels:
    app: mp-calculator-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp-calculator-api
  template:
    metadata:
      labels:
        app: mp-calculator-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: okongzinc/mp-calculator-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: mp-calculator-config
        - secretRef:
            name: mp-calculator-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mp-calculator-api
  namespace: mp-calculator
  labels:
    app: mp-calculator-api
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: mp-calculator-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-calculator-web
  namespace: mp-calculator
  labels:
    app: mp-calculator-web
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp-calculator-web
  template:
    metadata:
      labels:
        app: mp-calculator-web
        version: v1
    spec:
      containers:
      - name: web
        image: okongzinc/mp-calculator-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mp-calculator-web
  namespace: mp-calculator
  labels:
    app: mp-calculator-web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: mp-calculator-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mp-calculator-ingress
  namespace: mp-calculator
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  tls:
  - hosts:
    - dev.mpcalculator.app
    - api.dev.mpcalculator.app
    secretName: mp-calculator-tls
  rules:
  - host: dev.mpcalculator.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mp-calculator-web
            port:
              number: 80
  - host: api.dev.mpcalculator.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mp-calculator-api
            port:
              number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mp-calculator-api-hpa
  namespace: mp-calculator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mp-calculator-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max