apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mp-calculator

resources:
- ../../base/mp-calculator.yaml

commonLabels:
  environment: production

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mp-calculator-api
    spec:
      replicas: 3
      template:
        spec:
          containers:
          - name: api
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
            env:
            - name: NODE_ENV
              value: "production"
  target:
    kind: Deployment
    name: mp-calculator-api

- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mp-calculator-web
    spec:
      replicas: 3
  target:
    kind: Deployment
    name: mp-calculator-web

images:
- name: okongzinc/mp-calculator-api
  newTag: v1.0.0
- name: okongzinc/mp-calculator-web
  newTag: v1.0.0

configMapGenerator:
- name: mp-calculator-config
  behavior: merge
  literals:
  - NODE_ENV=production
  - LOG_LEVEL=warn
  - CORS_ORIGIN=https://mpcalculator.app
  - FRONTEND_URL=https://mpcalculator.app