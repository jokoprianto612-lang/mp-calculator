apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mp-calculator

resources:
- ../../base/mp-calculator.yaml

commonLabels:
  environment: dev

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mp-calculator-api
    spec:
      replicas: 1
      template:
        spec:
          containers:
          - name: api
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "250m"
  target:
    kind: Deployment
    name: mp-calculator-api

- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mp-calculator-web
    spec:
      replicas: 1
  target:
    kind: Deployment
    name: mp-calculator-web

images:
- name: okongzinc/mp-calculator-api
  newTag: dev-latest
- name: okongzinc/mp-calculator-web
  newTag: dev-latest

configMapGenerator:
- name: mp-calculator-config
  behavior: merge
  literals:
  - NODE_ENV=development
  - LOG_LEVEL=debug
  - CORS_ORIGIN=https://dev.mpcalculator.app
  - FRONTEND_URL=https://dev.mpcalculator.app